# AniHub Nginx 配置（由 deploy/setup.sh 安装，__DOMAIN__ 会被替换）
# 安装位置: /etc/nginx/sites-available/anihub
# HTTP 跳 HTTPS + Let's Encrypt 验证路径
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点：反向代理到 Express（端口 3001）
server {
    # 注意：http2 用 listen 参数形式（兼容 Nginx < 1.25；1.25+ 的 "http2 on;" 旧版不认）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 图片上传（服务端限制单图 ≤8MB，正文 JSON ≤2MB）
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
