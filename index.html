<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 不锁定 maximum-scale：允许双指缩放（无障碍要求），表单控件在 768px 以下
         已是 16px，不会触发 iOS 聚焦自动放大 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1015" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f4f9" media="(prefers-color-scheme: light)" />
    <meta name="description" content="AniHub —— 新番日历 · 更新日志 · 笔记 · 工具箱" />
    <!-- 图标：原来直接引用 864×886 / 929KB 的 anihub.png，
         浏览器只显示 16–32px，白白拖慢首屏。现在用按需生成的 32px 图标，
         iOS 添加到主屏用 180px 版本（生成脚本见 scripts/optimize-assets.mjs）。 -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <script>
      // 尽早设置主题，避免首屏闪烁（与 src/composables/useTheme.js 同规则）
      ;(function () {
        var t = localStorage.getItem('anime-calendar.theme') || 'auto'
        var h = new Date().getHours()
        var r = t === 'auto' ? (h >= 6 && h < 18 ? 'light' : 'dark') : t
        document.documentElement.dataset.theme = r
        // Anime 页 / 登录管理员 / 内部人员模式：在首帧前恢复上次的壁纸（与 useWallpaper 的缓存键一致），
        // 避免刷新时先显示纯色背景再闪出壁纸
        var isInsider = !!localStorage.getItem('anihub.insider')
        var isAdmin = !!localStorage.getItem('anihub.token')
        if (location.pathname.indexOf('/anime') === 0 || isInsider || isAdmin) {
          var w = localStorage.getItem('anime-calendar.wallpaper')
          if (w) {
            document.documentElement.style.setProperty('--wallpaper-url', 'url("' + w.replace(/"/g, '\\"') + '")')
          }
        }
      })()
    </script>
    <title>AniHub</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
